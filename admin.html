<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acesso administrativo | Chá de Casa Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#263b31;color:#2d332d;font-family:'DM Sans',Arial,sans-serif}.login{width:min(100%,420px);padding:38px;background:#fffdf8;border:1px solid #d5bd8c}.mark{text-align:center;font:36px 'Playfair Display',serif;color:#7d8e73}.eyebrow{text-align:center;font-size:9px;letter-spacing:2px;color:#8c8b73;font-weight:700;margin:8px 0 18px}h1{text-align:center;font:400 34px 'Playfair Display',serif;margin:0 0 8px;color:#2d4033}p{text-align:center;color:#777a70;font-size:12px;line-height:1.7;margin:0 0 26px}label{display:block;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #dfe2d8;background:#fffefa;font:13px 'DM Sans',sans-serif}button{width:100%;padding:14px;background:#304638;color:#fff8ed;border:0;margin-top:20px;font-weight:700;cursor:pointer}#mensagem-login{margin-top:14px;color:#a94438;font-size:12px;line-height:1.6;text-align:center}.back{display:block;text-align:center;margin-top:18px;color:#64765d;font-size:11px;text-decoration:none}
</style></head>
<body><main class="login"><div class="mark">⌂</div><div class="eyebrow">ÁREA RESTRITA</div><h1>Bem-vindo de volta.</h1><p>Entre para administrar os convidados e a lista de presentes.</p>
<form id="login-form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button id="botao-login" type="submit">Entrar no painel ↗</button><div id="mensagem-login" role="status"></div></form><a class="back" href="index.html">← Voltar ao convite</a></main><script type="module" src="admin.js"></script></body></html>
